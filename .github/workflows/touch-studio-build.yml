name: DRNAS Touch Studio Android APK
on:
  push:
    paths:
      - '.github/workflows/touch-studio-build.yml'
      - 'native-gui-upstream/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drnas-touch-studio-apk
  cancel-in-progress: true

jobs:
  build-touch-studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Touch Studio source bundle
        uses: actions/checkout@v4

      - name: Checkout pinned Blender Android source
        uses: actions/checkout@v4
        with:
          repository: simfeo/blender
          ref: d93bd33cba768e19ee4387a31c0ea137ee2f0047
          path: upstream
          fetch-depth: 1
          lfs: false
          submodules: false
          sparse-checkout: |
            build_files/android/apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download native baseline and verify bridge
        run: |
          set -euxo pipefail
          mkdir -p baseline fast/unpacked fast/javac fast/dex fast/compiled out
          curl -fL --retry 3 --retry-all-errors \
            -o baseline/Native-Blender-PreAlpha-0.1-arm64.apk \
            https://github.com/Frane12/DRNAS-Native-Blender/releases/download/native-prealpha-v0.1/Native-Blender-PreAlpha-0.1-arm64.apk
          unzip -p baseline/Native-Blender-PreAlpha-0.1-arm64.apk lib/arm64-v8a/libblender.so > /tmp/libblender.so
          readelf -Ws /tmp/libblender.so | grep -F 'Java_org_blender_blender_BlenderActivity_nativeOnDrnasInput'
          readelf -Ws /tmp/libblender.so | grep -F 'Java_org_blender_blender_BlenderActivity_nativeOnKey'
          unzip -Z1 baseline/Native-Blender-PreAlpha-0.1-arm64.apk | grep -F 'assets/blender_runtime.zip'
          unzip -q baseline/Native-Blender-PreAlpha-0.1-arm64.apk 'lib/*' 'assets/*' -d fast/unpacked

      - name: Install the new controls (legacy overlay bypassed)
        run: |
          set -euxo pipefail
          python3 native-gui-upstream/install_touch_studio.py upstream
          python3 native-gui-upstream/test_touch_studio.py upstream
          mkdir -p fast/jvm-tests
          javac -d fast/jvm-tests native-gui-upstream/DrnasInputHold.java native-gui-upstream/DrnasInputHoldTest.java
          java -cp fast/jvm-tests DrnasInputHoldTest

      - name: Compile Android Java and resources
        run: |
          set -euxo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.1'
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          BT="$ANDROID_HOME/build-tools/35.0.1"
          find upstream/build_files/android/apk/app/src/main/java -name '*.java' -print0 \
            | xargs -0 javac --release 17 -classpath "$ANDROID_JAR" -d fast/javac
          "$BT/d8" --min-api 31 --output fast/dex $(find fast/javac -name '*.class')
          "$BT/aapt2" compile --dir upstream/build_files/android/apk/app/src/main/res -o fast/compiled/res.zip
          "$BT/aapt2" link -o fast/base.apk -I "$ANDROID_JAR" \
            --manifest upstream/build_files/android/apk/app/src/main/AndroidManifest.xml \
            -A fast/unpacked/assets -0 zip --min-sdk-version 31 --target-sdk-version 34 \
            --version-code 200 --version-name '0.2.0-touch-studio' fast/compiled/res.zip

      - name: Assemble and sign isolated test APK
        run: |
          set -euxo pipefail
          OUT=out/DRNAS-Blender-Touch-Studio-arm64.apk
          cp fast/base.apk "$OUT"
          (cd fast/dex && zip -q "$GITHUB_WORKSPACE/$OUT" classes.dex)
          (cd fast/unpacked && zip -qr "$GITHUB_WORKSPACE/$OUT" lib)
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -f -p 4 "$OUT" fast/aligned.apk
          mv fast/aligned.apk "$OUT"
          keytool -genkeypair -keystore fast/touch-studio.keystore \
            -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname 'CN=DRNAS Touch Studio TEST,O=DRNAS,C=HR'
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" sign --ks fast/touch-studio.keystore \
            --ks-pass pass:android --key-pass pass:android "$OUT"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$OUT"
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$OUT" | grep -F 'hr.drnas.blendertouchstudio2026'
          python3 native-gui-upstream/verify_touch_studio_repack.py \
            baseline/Native-Blender-PreAlpha-0.1-arm64.apk "$OUT"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          cp native-gui-upstream/../README.md out/README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-Blender-Touch-Studio
          path: out/
          if-no-files-found: error
          retention-days: 30
